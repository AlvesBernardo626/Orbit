services:
  - type: web
    name: orbit-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: virginia
    numInstances: 1
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: orbit://app
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false
      - key: ICE_RELAY_ONLY
        value: "false"
