services:
  - type: web
    name: orbit-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: virginia
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: orbit://app
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: REGISTRATION_ENABLED
        value: 'true'
      - key: RELEASE_CACHE_SECONDS
        value: 300
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false
      - key: ICE_RELAY_ONLY
        value: 'false'
